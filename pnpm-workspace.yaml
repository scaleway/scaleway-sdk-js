packages:
  - 'packages/*'
  - 'packages_generated/*'
  - 'tools/*'

tasks:
  build:
    dependsOn:
      - ^build
  typecheck:
    dependsOn:
      - build

savePrefix: ''
strictPeerDependencies: false
autoInstallPeers: true
engineStrict: true

catalog:
  vite: 8.3.4
  vitest: 5.0.3
  tsdown: 0.23.1
  '@types/react': 19.3.0
  '@types/node': 26.6.5
  '@scaleway/random-name': 6.0.2
  '@scaleway/use-dataloader': 7.2.2

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
  '@types/react': 'catalog:'
  '@types/node': 'catalog:'

# 12h
minimumReleaseAge: 720
minimumReleaseAgeExclude:
  - '@scaleway/*'
  # Renovate security update: @vitest/ui@5.0.5
  - "@vitest/ui@5.0.5"

# Needed as we run a pnpm install after building packages
optimisticRepeatInstall: false

allowBuilds:
  esbuild: true
  nx: true

versioning:
  ignore:
    - './tools/**'
  changelog:
    storage: repository
