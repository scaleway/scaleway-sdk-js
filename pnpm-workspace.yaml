packages:
  - 'packages/*'
  - 'packages_generated/*'
  - 'tools/*'

tasks:
  typecheck:
    dependsOn:
      - build

savePrefix: ''
strictPeerDependencies: false
autoInstallPeers: true
engineStrict: true

catalog:
  vite: 8.2.2
  vitest: 5.0.0
  '@types/react': 19.2.18
  '@types/node': 26.4.1
  '@scaleway/random-name': 6.0.2

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
  '@types/react': 'catalog:'
  '@types/node': 'catalog:'

# 12h
minimumReleaseAge: 720
minimumReleaseAgeExclude:
  - '@scaleway/*'

# Needed as we run a pnpm install after building packages
optimisticRepeatInstall: false

allowBuilds:
  esbuild: true
  nx: true

versioning:
  ignore:
    - './tools/**'
  changelog:
    storage: repository
