name: Setup
description: Install pnpm/Node, build tools, and relink bins (run after checkout)

inputs:
  node-version:
    description: Node.js version (defaults to .nvmrc)
    required: false
    default: ''
  registry-url:
    description: npm registry URL (for publishing)
    required: false
    default: ''
  frozen-lockfile:
    description: Use frozen lockfile (true) or --no-frozen-lockfile (false)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version || '' }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        check-latest: true
        cache: 'pnpm'
        registry-url: ${{ inputs.registry-url }}
    - run: ${{ inputs.frozen-lockfile == 'true' && 'pnpm install' || 'pnpm install --no-frozen-lockfile' }}
      shell: bash
    # need to build tools and install to make the bin available
    - run: pnpm --filter "./tools/*" run build
      shell: bash
    # relinks bins without reinstalling
    - run: rm -rf node_modules && pnpm install
      shell: bash
